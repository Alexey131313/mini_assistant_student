[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: тесты, которым нужен Postgres (TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # длину строки держит форматтер
    "RUF001", # русские буквы в строках
    "RUF002", # русские буквы в докстрингах
    "RUF003", # русские буквы в комментариях
    "COM812", # конфликт с форматтером
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "psycopg.*", "alembic.*", "respx.*"]
ignore_missing_imports = true
