services:
  db:
    image: postgres:16
    container_name: mini_assistant_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini}
      POSTGRES_DB: ${POSTGRES_DB:-mini_assistant}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini} -d ${POSTGRES_DB:-mini_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: mini_assistant_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
